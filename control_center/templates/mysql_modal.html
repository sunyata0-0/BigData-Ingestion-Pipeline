<input type="checkbox" id="mysql-modal-toggle" class="modal-toggle" aria-hidden="true">

<div class="modal" id="mysql-modal" role="dialog" aria-modal="true" aria-labelledby="mysql-modal-title">

    <label for="mysql-modal-toggle" class="modal__backdrop" aria-hidden="true"></label>

    <div class="modal__card modal__card--mysql" role="document">

        <header class="modal__header">
            <div>
                <h2 class="modal__title" id="mysql-modal-title">MySQL Data Entry</h2>
                <p class="modal__subtitle">Insert new employee into the customers table.</p>
            </div>
            <label for="mysql-modal-toggle" class="modal__close" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </label>
        </header>

        <div class="modal__body">
            <form class="mysql-form" novalidate>

                <div class="mysql-form__grid">
                    <div class="form-field">
                        <label class="form-field__label" for="mysql-first-name">First Name</label>
                        <input type="text" id="mysql-first-name" name="first_name" class="form-field__input" placeholder="e.g. Mahdi" autocomplete="off">
                    </div>

                    <div class="form-field">
                        <label class="form-field__label" for="mysql-last-name">Last Name</label>
                        <input type="text" id="mysql-last-name" name="last_name" class="form-field__input" placeholder="e.g. Nefzi" autocomplete="off">
                    </div>
                </div>

                <div class="form-field">
                    <label class="form-field__label" for="mysql-department">Department</label>
                    <div class="mysql-select-wrap">
                        <select id="mysql-department" name="department" class="form-field__input mysql-select">
                            <option value="" disabled selected>Select department</option>
                            <option value="IT">IT</option>
                            <option value="HR">HR</option>
                            <option value="Finance">Finance</option>
                            <option value="Marketing">Marketing</option>
                        </select>
                        <span class="mysql-select-arrow" aria-hidden="true">&#9662;</span>
                    </div>
                </div>

                <div class="form-field">
                    <label class="form-field__label" for="mysql-salary">Salary</label>
                    <input type="number" id="mysql-salary" name="salary" class="form-field__input" placeholder="e.g. 00001" min="0" step="100" inputmode="numeric">
                </div>

            </form>

            <footer class="modal__footer">
                <button type="button" id="mysql-insert-btn" class="modal-btn modal-btn--primary">Insert Row</button>
            </footer>

            <div id="mysql-status" class="mysql-status" role="status" aria-live="polite"></div>
        </div>

    </div>
</div>
